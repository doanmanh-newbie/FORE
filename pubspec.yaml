name: fore
description: Quản lý quán bán, đối soát nguyên liệu và phát hiện thất thoát.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  image_picker: ^1.1.2
  provider: ^6.1.2
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.6
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  permission_handler: ^12.0.1
  geolocator: ^14.1.2
  firebase_analytics: ^13.1.0
  firebase_crashlytics: ^6.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/splash/
    - assets/icons/
    - assets/auth/
    - assets/brand/

  fonts:
    - family: ForeInter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: ForeNewsreader
      fonts:
        - asset: assets/fonts/Newsreader-500.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-600.ttf
          weight: 600
